<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PolyTrack</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

#box {
    width: 400px;
}

button {
    padding: 12px 30px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}

#downloads {
    margin-top: 20px;
    height: 150px;
    overflow: hidden;
    text-align: left;
    font-family: monospace;
}

.file {
    margin: 3px;
}
</style>
</head>

<body>

<div id="box">

    <h1>PolyTrack</h1>

    <h2>Do you want to play?</h2>

    <button onclick="playGame()">YES</button>
    <button onclick="noAccess()">NO</button>

    <div id="downloads"></div>

</div>

<script>

function noAccess() {
    document.getElementById("box").innerHTML = `
        <h1>Access Granted 🔓</h1>
        <p>You chose wisely.</p>
        <button onclick="location.reload()">Continue</button>
    `;
}

function playGame() {

    document.getElementById("box").innerHTML = `
        <h1>Downloading PolyTrack...</h1>
        <p id="status">Preparing files...</p>
        <div id="downloads"></div>
    `;

    let count = 0;

    const interval = setInterval(() => {

        count++;

        const file = document.createElement("div");
        file.className = "file";
        file.textContent =
            "Downloading: polytrack_file_" +
            count +
            ".txt";

        document.getElementById("downloads").appendChild(file);

        document.getElementById("status").textContent =
            "Downloading " + count + " files...";

        if (count >= 100) {
            clearInterval(interval);

            document.getElementById("status").textContent =
                "Just kidding 💀";

            setTimeout(() => {
                location.reload();
            }, 2000);
        }

    }, 50);
}

</script>

</body>
</html>
