<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preload" href="forced_square.woff2" as="font" type="font/woff2" crossorigin="anonymous"/>
<link rel="preload" href="images/logo.svg" as="image" type="image/svg+xml"/>
<link rel="preload" href="images/discord.svg" as="image" type="image/svg+xml"/>
<link rel="manifest" href="manifest.json"/>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<script defer="defer" src="error_screen.bundle.js"></script>
<script defer="defer" src="main.bundle.js"></script>

<style>
#prank-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 999999;
}

#prank-box {
    width: 400px;
}

.prank-btn {
    padding: 12px 30px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}

#status {
    margin-top: 20px;
    font-family: monospace;
}
</style>
</head>

<body>

<canvas id="screen"></canvas>

<div id="ui">
    <div id="prank-overlay">
        <div id="prank-box">
            <h1>PolyTrack</h1>
            <h2>Do you want to play?</h2>
            <button class="prank-btn" onclick="yes()">YES</button>
            <button class="prank-btn" onclick="no()">NO</button>
            <p id="status"></p>
        </div>
    </div>
</div>

<div id="transition-layer"></div>

<script>
function no() {
    document.getElementById("prank-overlay").remove();
}

function yes() {
    const totalFiles = 100;
    const prankMessages = [
        "You clicked YES. 💀",
        "Why did you click YES?",
        "This is a harmless prank.",
        "Your PolyTrack experience has been temporarily interrupted.",
        "Maybe click NO next time. 🗿"
    ];

    const files = Array.from({ length: totalFiles }, (_, i) => [
        `polytrack_${i + 1}.txt`,
        `[File ${i + 1}/${totalFiles}] ${prankMessages[i % prankMessages.length]}`
    ]);

    document.getElementById("status").textContent = "Downloading files...";

    files.forEach((file, index) => {
        setTimeout(() => {
            const blob = new Blob([file[1]], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            
            link.href = url;
            link.download = file[0];
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            document.getElementById("status").textContent =
                "Downloaded " + (index + 1) + " / " + files.length;

            if (index === files.length - 1) {
                setTimeout(() => {
                    document.getElementById("prank-box").innerHTML = `
                        <h1>💀 Gotcha</h1>
                        <p>You downloaded all 100 files.</p>
                        <button class="prank-btn" onclick="no()">Play Game</button>
                    `;
                }, 500);
            }
        }, index * 150);
    });
}
</script>

</body>
</html>
