```html
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PolyTrack</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

#box {
    width: 400px;
}

button {
    padding: 12px 30px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}

#status {
    margin-top: 20px;
    font-family: monospace;
}
</style>
</head>

<body>

<div id="box">

    <h1>PolyTrack</h1>

    <h2>Do you want to play?</h2>

    <button onclick="yes()">YES</button>
    <button onclick="no()">NO</button>

    <p id="status"></p>

</div>

<script>

function no() {
    document.getElementById("box").innerHTML = `
        <h1>Access Granted 🔓</h1>
        <p>You chose NO. You may now play PolyTrack.</p>
    `;
}

function yes() {

    const files = [
        ["polytrack_1.txt", "You clicked YES. 💀"],
        ["polytrack_2.txt", "Why did you click YES?"],
        ["polytrack_3.txt", "This is a harmless prank."],
        ["polytrack_4.txt", "Your PolyTrack experience has been temporarily interrupted."],
        ["polytrack_5.txt", "Maybe click NO next time. 🗿"]
    ];

    document.getElementById("status").textContent =
        "Downloading files...";

    files.forEach((file, index) => {

        setTimeout(() => {

            const blob = new Blob(
                [file[1]],
                { type: "text/plain" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = file[0];

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            URL.revokeObjectURL(url);

            document.getElementById("status").textContent =
                "Downloaded " + (index + 1) + " / " + files.length;

            if (index === files.length - 1) {
                setTimeout(() => {
                    document.getElementById("box").innerHTML = `
                        <h1>💀 Gotcha</h1>
                        <p>You downloaded the files.</p>
                        <button onclick="location.reload()">Go Back</button>
                    `;
                }, 500);
            }

        }, index * 500);

    });
}

</script>

</body>
</html>
```
